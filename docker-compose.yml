name: social-follow-tracker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: following
      POSTGRES_USER: following
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U following -d following"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Only reachable from this PC. The page shows your connection data and can replace the stored credentials.
    ports:
      - "127.0.0.1:${PORT:-47321}:8080"
    environment:
      ConnectionStrings__Tracker: "Host=db;Database=following;Username=following;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      TZ: ${TZ:-UTC}
      Tracker__DailyAt: ${DAILY_AT:-09:00}
    volumes:
      - keys:/keys
      - ${EXPORTS_DIR:-./imports}:/imports:ro

volumes:
  pgdata:
  keys:
